[package]
name = "glamor"
version = "0.1.0"
description = "glamor — desktop shell for glamord (AI pipelines)"
authors = ["fableFM"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# sidecar (glamord) поставляется в релизной сборке; в dev — внешний процесс
default = []
